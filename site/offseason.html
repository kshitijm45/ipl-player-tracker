<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offseason</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  /* ═══════════════════════════════════════════════════════════════
     OFFSEASON — where IPL players go for the other ten months.

     Space is the whole brief: an 8px rhythm, 28-32px inside every
     surface, 72px between sections. Nothing touches anything.

     Type — Archivo carries the UI with real weight contrast;
     Instrument Serif appears once per view as an editorial voice;
     JetBrains Mono sets every figure, because scores are columns.

     Colour — a near-black ground so franchise colour is the only
     saturation on the page, arriving as a wash behind each surface.
     ═══════════════════════════════════════════════════════════════ */

  :root {
    --gold: #E8B54B;

    --bg: #FBFAF7;
    --surface: #FFFFFF;
    --raised: #FFFFFF;
    --sunk: #F2F0EB;
    --line: #E7E3DA;
    --line-soft: #F0EDE6;

    --ink: #16161A;
    --ink-2: #55555F;
    --ink-3: #8E8E99;

    --pos: #17794C;
    --neg: #B3453A;

    --team: #16161A;
    --team-2: var(--gold);
    --team-ink: #FFFFFF;
    --team-wash: 0, 0, 0;

    --sh-1: 0 1px 2px rgba(22,22,26,.04), 0 2px 8px -4px rgba(22,22,26,.06);
    --sh-2: 0 2px 6px rgba(22,22,26,.05), 0 12px 32px -12px rgba(22,22,26,.14);
    --sh-3: 0 4px 12px rgba(22,22,26,.07), 0 24px 60px -20px rgba(22,22,26,.22);

    --rad: 14px;
    --rad-sm: 9px;
    --rail: 300px;

    --e: cubic-bezier(.2, .7, .3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0B0E;
      --surface: #141419;
      --raised: #1A1A21;
      --sunk: #101015;
      --line: #26262F;
      --line-soft: #1E1E26;
      --ink: #F2F1EE;
      --ink-2: #A9A9B4;
      --ink-3: #74747F;
      --pos: #4FC98B;
      --neg: #E8776A;
      --team: #F2F1EE;
      --sh-1: 0 1px 2px rgba(0,0,0,.5);
      --sh-2: 0 2px 8px rgba(0,0,0,.5), 0 16px 40px -16px rgba(0,0,0,.8);
      --sh-3: 0 4px 16px rgba(0,0,0,.6), 0 30px 70px -24px rgba(0,0,0,.95);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0B0B0E; --surface: #141419; --raised: #1A1A21; --sunk: #101015;
    --line: #26262F; --line-soft: #1E1E26;
    --ink: #F2F1EE; --ink-2: #A9A9B4; --ink-3: #74747F;
    --pos: #4FC98B; --neg: #E8776A; --team: #F2F1EE;
    --sh-1: 0 1px 2px rgba(0,0,0,.5);
    --sh-2: 0 2px 8px rgba(0,0,0,.5), 0 16px 40px -16px rgba(0,0,0,.8);
    --sh-3: 0 4px 16px rgba(0,0,0,.6), 0 30px 70px -24px rgba(0,0,0,.95);
  }

  /* Franchise identity. --team-wash is the RGB triplet used for tints. */
  [data-team="Chennai Super Kings"]         { --team:#D89A00; --team-2:#1A4FA0; --team-ink:#1A1300; --team-wash:216,154,0; }
  [data-team="Delhi Capitals"]              { --team:#1B4CA8; --team-2:#D6202F; --team-ink:#fff; --team-wash:27,76,168; }
  [data-team="Gujarat Titans"]              { --team:#1B2A4A; --team-2:#C6A04A; --team-ink:#fff; --team-wash:27,42,74; }
  [data-team="Kolkata Knight Riders"]       { --team:#573089; --team-2:#D4AF37; --team-ink:#fff; --team-wash:87,48,137; }
  [data-team="Lucknow Super Giants"]        { --team:#0B6CC4; --team-2:#E8842B; --team-ink:#fff; --team-wash:11,108,196; }
  [data-team="Mumbai Indians"]              { --team:#0A50A1; --team-2:#C6A04A; --team-ink:#fff; --team-wash:10,80,161; }
  [data-team="Punjab Kings"]                { --team:#CC1C23; --team-2:#B9BDC2; --team-ink:#fff; --team-wash:204,28,35; }
  [data-team="Rajasthan Royals"]            { --team:#D6217A; --team-2:#1B2A4A; --team-ink:#fff; --team-wash:214,33,122; }
  [data-team="Royal Challengers Bengaluru"] { --team:#C8172B; --team-2:#161616; --team-ink:#fff; --team-wash:200,23,43; }
  [data-team="Sunrisers Hyderabad"]         { --team:#E35D18; --team-2:#1B2A4A; --team-ink:#fff; --team-wash:227,93,24; }

  :root[data-theme="dark"] [data-team="Chennai Super Kings"],
  :root[data-theme="dark"] [data-team="Gujarat Titans"] { --team:#F0BC2A; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) [data-team="Chennai Super Kings"] { --team:#F0BC2A; }
    :root:not([data-theme="light"]) [data-team="Gujarat Titans"] { --team:#8FA8D8; --team-wash:143,168,216; }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Archivo, system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ─── shell ─────────────────────────────────────────────── */
  .app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }

  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .brand { padding: 30px 28px 22px; flex: none; }
  .brand h1 {
    margin: 0;
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1;
  }
  .brand h1 i { font-style: normal; color: var(--gold); }
  .brand p {
    margin: 9px 0 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-3);
    max-width: 30ch;
  }

  .seek { padding: 0 20px 18px; flex: none; position: relative; }
  .seek > div {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--sunk);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 11px 14px;
    transition: border-color .16s var(--e), background .16s var(--e);
  }
  .seek > div:focus-within { border-color: var(--ink-3); background: var(--surface); }
  .seek svg { flex: none; color: var(--ink-3); }
  .seek input { border: 0; background: none; outline: none; width: 100%; font-size: 13.5px; }
  .seek input::placeholder { color: var(--ink-3); }

  /* The clear affordance only exists once there is something to clear, so the
     field is not permanently carrying a dead button. */
  .seek-x {
    flex: none; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--ink-3); font-size: 15px; line-height: 1; display: none;
  }
  .seek-x:hover { color: var(--ink); }
  .seek[data-on="true"] .seek-x { display: block; }

  .rail-scroll { flex: 1; overflow-y: auto; padding: 0 12px 28px; scrollbar-width: thin; }

  /* ── search results ──
     A ranked list of players, not a filter on the page behind it: typing offers
     people to open rather than silently narrowing every other view. */
  .hits { padding: 0 12px 28px; }
  .hits-note {
    padding: 4px 14px 10px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .hit {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 14px;
    background: none;
    border: 0;
    border-radius: 10px;
    text-align: left;
    color: var(--ink-2);
    cursor: pointer;
    transition: background .14s var(--e), color .14s var(--e);
  }
  /* Hover and the keyboard cursor both tint toward the player's franchise, so
     moving down the list reads as moving between clubs rather than as a grey
     highlight travelling over undifferentiated rows. */
  .hit:hover, .hit[data-cursor="true"] {
    background: rgba(var(--team-wash), .12);
    color: var(--ink);
  }
  .hit[data-cursor="true"] { box-shadow: inset 0 0 0 1px rgba(var(--team-wash), .45); }
  .hit .crest {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 9px;
    /* The franchise's own colour, as the rail and the daily rows use it, rather
       than a wash of it: at 34px the abbreviation is the identity, so it needs the
       contrast of the solid tile. */
    background: var(--team);
    color: var(--team-ink);
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    font-family: "Archivo Expanded", Archivo, sans-serif;
    box-shadow: 0 2px 6px rgba(var(--team-wash), .3);
  }
  /* A player with no franchise has no colour to borrow, and the team variables fall
     back to black — so the tile is explicitly neutral rather than a black square. */
  .hit[data-team=""] .crest { background: var(--sunk); color: var(--ink-3); box-shadow: none; }
  .hit[data-team=""]:hover, .hit[data-team=""][data-cursor="true"] { background: var(--sunk); }
  .hit[data-team=""][data-cursor="true"] { box-shadow: inset 0 0 0 1px var(--line); }
  .hit-main { min-width: 0; flex: 1; }
  .hit-main b {
    display: block;
    font-size: 13.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hit-main span {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Why a player matched, when it was not his display name that did it. */
  .hit-main i { font-style: normal; color: var(--ink-2); }
  .hit mark { background: none; color: var(--gold); font-weight: 700; }

  .seek-none {
    padding: 10px 14px 16px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-3);
  }

  .club { margin-bottom: 4px; }

  .club-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px 14px;
    background: none;
    border: 0;
    border-radius: 11px;
    text-align: left;
    color: var(--ink-2);
    transition: background .16s var(--e), color .16s var(--e);
  }
  .club-btn:hover { background: var(--sunk); color: var(--ink); }
  .club-btn[data-live="true"] {
    background: linear-gradient(90deg, rgba(var(--team-wash), .14), rgba(var(--team-wash), .04));
    color: var(--ink);
  }
  .club-btn:focus-visible { outline: 2px solid var(--team); outline-offset: -2px; }

  .crest {
    width: 34px; height: 34px;
    flex: none;
    border-radius: 9px;
    background: var(--team);
    color: var(--team-ink);
    display: grid;
    place-items: center;
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    box-shadow: 0 2px 6px rgba(var(--team-wash), .3);
  }

  .club-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; line-height: 1.3; }
  .club-n { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-3); }

  .club-all {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: none;
    border: 0;
    border-radius: 11px;
    text-align: left;
    color: var(--ink-2);
    transition: background .16s var(--e), color .16s var(--e);
  }
  .club-all:hover { background: var(--sunk); color: var(--ink); }
  .club-all[aria-current="true"] { background: var(--ink); color: var(--bg); }
  .club-all[aria-current="true"] .club-n { color: inherit; opacity: .6; }
  .club-all:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .all-mark {
    width: 34px; height: 34px;
    flex: none;
    border-radius: 9px;
    background: var(--sunk);
    color: var(--ink-3);
    display: grid;
    place-items: center;
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .club-all[aria-current="true"] .all-mark { background: rgba(255,255,255,.16); color: inherit; }

  /* A chosen club gets a full-strength bar, not just a wash. */
  .club-btn[aria-current="true"] {
    background: linear-gradient(90deg, rgba(var(--team-wash), .2), rgba(var(--team-wash), .05));
    color: var(--ink);
    font-weight: 600;
    box-shadow: inset 3px 0 0 var(--team);
  }

  .roster { display: none; padding: 6px 0 10px 18px; }
  .roster.open { display: block; }

  .rp {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 13px;
    background: none;
    border: 0;
    border-left: 2px solid var(--line);
    color: var(--ink-2);
    font-size: 13px;
    text-align: left;
    transition: all .14s var(--e);
  }
  .rp:hover { color: var(--ink); border-left-color: var(--team); background: var(--sunk); }
  .rp[aria-current="true"] {
    color: var(--team);
    border-left-color: var(--team);
    background: rgba(var(--team-wash), .09);
    font-weight: 600;
  }
  .rp:focus-visible { outline: 2px solid var(--team); outline-offset: -2px; }
  .rp span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-n { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--ink-3); }

  /* ─── main ──────────────────────────────────────────────── */
  .main { min-width: 0; display: flex; flex-direction: column; }

  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }

  .nav { display: flex; gap: 4px; }
  .nav button {
    padding: 9px 17px;
    background: none;
    border: 0;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-3);
    transition: all .16s var(--e);
  }
  .nav button:hover { color: var(--ink); background: var(--sunk); }
  .nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .nav button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .segs { display: flex; gap: 3px; margin-left: auto; background: var(--sunk); padding: 4px; border-radius: 10px; }
  .segs button {
    padding: 7px 14px;
    background: none;
    border: 0;
    border-radius: 7px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-3);
    transition: all .16s var(--e);
  }
  .segs button:hover { color: var(--ink); }
  .segs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
  .segs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  .canvas { padding: 44px 40px 96px; max-width: 1360px; width: 100%; }

  .sect { margin-bottom: 20px; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .sect h2 {
    margin: 0;
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  .sect p { margin: 0; font-size: 13.5px; color: var(--ink-3); }
  .sect + * { margin-top: 0; }
  .gap { height: 72px; }

  /* ─── daily ─────────────────────────────────────────────── */
  .datebar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .datebar .nav-btn {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink-2);
    transition: all .16s var(--e);
  }
  .datebar .nav-btn:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); transform: translateY(-1px); }
  .datebar .nav-btn:disabled { opacity: .35; }
  .datebar .nav-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .datehead { display: flex; flex-direction: column; gap: 2px; }
  .datehead b {
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.05;
  }
  .datehead span { font-size: 12.5px; color: var(--ink-3); }

  .datebar select {
    margin-left: auto;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    color: var(--ink-2);
    max-width: 100%;
  }

  /* Headline performance of the day */
  .headline {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 32px;
    align-items: center;
    padding: 34px 36px;
    border-radius: var(--rad);
    background:
      linear-gradient(120deg, rgba(var(--team-wash), .16), rgba(var(--team-wash), .03) 62%),
      var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--sh-2);
    margin-bottom: 26px;
    text-align: left;
    width: 100%;
    transition: transform .2s var(--e), box-shadow .2s var(--e);
  }
  .headline:hover { transform: translateY(-2px); box-shadow: var(--sh-3); }
  .headline:focus-visible { outline: 2px solid var(--team); outline-offset: 3px; }
  .headline::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: var(--team);
  }
  .hl-name {
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: clamp(26px, 3.6vw, 38px);
    font-weight: 700;
    letter-spacing: -.028em;
    line-height: 1.02;
    margin: 10px 0 12px;
    text-wrap: balance;
  }
  .hl-ctx { font-size: 14px; color: var(--ink-2); }
  .hl-ctx b { color: var(--team); font-weight: 600; }
  .hl-fig { text-align: right; }
  .hl-fig b {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 5.4vw, 58px);
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: .92;
    color: var(--team);
  }
  .hl-fig span { font-size: 12.5px; color: var(--ink-3); display: block; margin-top: 7px; }
  /* The live badge on the headline card sits under the context line rather than
     beside the figure, which is already as large as the card allows. */
  .hl-live { margin-top: 10px; }
  .hl-live .live-dot { margin-left: 0; }

  /* Performance rows */
  .rows { display: flex; flex-direction: column; gap: 10px; }

  .row {
    display: grid;
    grid-template-columns: 46px minmax(0, 1.5fr) minmax(0, 1.5fr) auto;
    gap: 22px;
    align-items: center;
    padding: 18px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--rad-sm);
    text-align: left;
    width: 100%;
    transition: transform .16s var(--e), box-shadow .16s var(--e), border-color .16s var(--e);
  }
  .row:hover { transform: translateX(3px); border-color: rgba(var(--team-wash), .5); box-shadow: var(--sh-1); }
  .row:focus-visible { outline: 2px solid var(--team); outline-offset: 2px; }

  .row .badge {
    width: 46px; height: 46px;
    border-radius: 11px;
    background: linear-gradient(140deg, rgba(var(--team-wash), .2), rgba(var(--team-wash), .08));
    color: var(--team);
    display: grid;
    place-items: center;
    font-family: "Archivo Expanded", Archivo, sans-serif;
    font-size: 13px;
    font-weight: 700;
  }
  .row .who b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
  .row .who span { font-size: 12.5px; color: var(--team); font-weight: 500; }
  .row .where { min-width: 0; }
  .row .where b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .row .where span { font-size: 12.5px; color: var(--ink-3); }
  .row .fig { text-align: right; white-space: nowrap; }

  .runs {
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .runs.big { color: var(--pos); }

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="nav" role="tablist">
        <button id="navToday" role="tab" aria-selected="true">Today</button>
        <button id="navForm" role="tab" aria-selected="false">Form</button>
        <button id="navAll" role="tab" aria-selected="false">All players</button>
      </div>
      <div class="segs" role="group" aria-label="Format">
        <button data-f="" aria-pressed="true">ALL</button>
        <button data-f="T20" aria-pressed="false">T20</button>
        <button data-f="ODI" aria-pressed="false">ODI</button>
        <button data-f="Test" aria-pressed="false">TEST</button>
      </div>
    </header>
    <main class="canvas" id="stage"></main>
  </div>
</div>

<script>
// Replaced with the built index by src/bundle-site.js, which writes offseason-live.html.
// The empty stub keeps this source file openable on its own without throwing.
window.__DATA__ = { players: [], perfs: [], days: [], meta: {}, fixtures: [], careers: {} };

const IPL = 'Indian Premier League';
const S = { view: 'today', club: '', player: null, fmt: '', q: '', day: null, cursor: -1 };
let P = [], F = [], D = [], M = {}, FX = [], CAR = {}, byP = new Map(), byD = new Map();

const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const club1 = (p) => p.iplTeams?.[0] || '';

const ABBR = {
  'Chennai Super Kings':'CSK','Delhi Capitals':'DC','Gujarat Titans':'GT',
  'Kolkata Knight Riders':'KKR','Lucknow Super Giants':'LSG','Mumbai Indians':'MI',
  'Punjab Kings':'PBKS','Rajasthan Royals':'RR','Royal Challengers Bengaluru':'RCB',
  'Sunrisers Hyderabad':'SRH',
};

function comp(c) {
  if (c === IPL) return 'IPL';
  return String(c)
    .replace(/^ICC Men's /, '')
    .replace(/ Sub Regional.*$/, ' Qual.')
    .replace(/ tour of /, ' in ')
    .replace(/^Big Bash League$/, 'BBL')
    .replace(/ T20I Series$/, '')
    .replace(/ Tri-Series$/, ' Tri');
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dShort(d) { const [, m, dd] = d.split('-'); return `${+dd} ${MON[+m - 1]}`; }
function dLong(d) {
  const x = new Date(d + 'T00:00:00');
  return x.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
const okFmt = (r) => !S.fmt || r.format === S.fmt;

/**
 * Players in scope: the chosen club's squad, or everyone when none is chosen.
 *
 * The search box deliberately does *not* narrow this. Typing used to re-scope every
 * view at once — the daily tracker, Coming Up, Form and the leaderboards — so a
 * reader looking up one name found the day's cricket replaced by "Nothing. Try
 * another filter." Search now offers players to open (see `matches`), and the club
 * rail remains the only thing that scopes the page.
 */
function squadInScope() {
  return S.club ? P.filter((p) => club1(p) === S.club) : P;
}

/** Does this innings belong to a player currently in scope? */
function inScope(r) {
  if (!scopeIds) return true;
  return scopeIds.has(r.playerId);
}
let scopeIds = null;

/** Recompute the scope set before any view reads it. */
function refreshScope() {
  scopeIds = S.club ? new Set(squadInScope().map((p) => p.id)) : null;
}

/* ── search ──
   One box, matched against everything a reader might plausibly type. Only the
   display name was searched before, so the data's other spellings were unreachable:
   the register knows "MD Shanaka" while the page shows "Dasun Shanaka", and a reader
   who typed the former got nothing. Teams, competitions and the CREX slug are all
   indexed too, so "Hundred", "CSK" and "Ranji" are all routes to a player. */

/** Strip accents and punctuation so "Lhuan-dre" is reachable as "lhuandre". */
function fold(s) {
  return String(s ?? '').toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

/** A player's searchable text, built once and cached on the record. */
function haystack(p) {
  if (p._h) return p._h;
  const name = fold(p.name);
  // The slug carries a CREX disambiguator ("hardik-pandya-C3"); the trailing code is
  // noise to a reader but harmless to keep, and occasionally it is what was pasted.
  const alt = [p.registerName, p.listedAs, p.crexSlug].filter(Boolean).map(fold);
  const teams = (p.iplTeams ?? []).concat(p.teams ?? []).map(fold);
  const abbr = (p.iplTeams ?? []).map((t) => fold(ABBR[t] ?? ''));
  const comps = (p.competitions ?? []).map(fold);
  p._h = {
    name,
    words: name.split(' ').filter(Boolean),
    alt: alt.join(' '),
    altWords: alt.flatMap((a) => a.split(' ')).filter(Boolean),
    teams: teams.concat(abbr).join(' '),
    comps: comps.join(' '),
  };
  return p._h;
}

/**
 * Score one player against a query, or 0 for no match.
 *
 * Ranked rather than filtered, because `includes` on its own buries the obvious
 * answer: "sam" matched Abdul Samad and Sameer Rizvi before Sam Curran, in whatever
 * order the squad happened to be in. An exact name beats a word that starts with the
 * query, which beats a substring anywhere, which beats a team or competition hit.
 */
function score(p, q) {
  const h = haystack(p);
  if (h.name === q) return 1000;
  if (h.name.startsWith(q)) return 900 - h.name.length;
  // A surname typed on its own is the common case, so any word starting the query
  // ranks well above a mid-word substring.
  if (h.words.some((w) => w.startsWith(q))) return 800 - h.name.length;
  if (h.name.includes(q)) return 600 - h.name.length;
  // Other spellings of the same person: the register name, the squad sheet's
  // spelling, the CREX slug.
  if (h.altWords.some((w) => w.startsWith(q))) return 500 - h.name.length;
  if (h.alt.includes(q)) return 400 - h.name.length;
  // A franchise, country or tournament: a broad hit, so it sorts last and leans on
  // the player's own recency to order it.
  if (h.teams.includes(q)) return 200;
  if (h.comps.includes(q)) return 100;
  return 0;
}

/** Why this player matched, when the display name alone does not explain it. */
function because(p, q) {
  const h = haystack(p);
  if (h.name.includes(q)) return null;
  if (h.alt.includes(q)) {
    const hit = [p.registerName, p.listedAs].find((n) => n && fold(n).includes(q));
    return hit ? `also ${hit}` : null;
  }
  const team = (p.iplTeams ?? []).concat(p.teams ?? []).find((t) => fold(t).includes(q)) ??
    (p.iplTeams ?? []).find((t) => fold(ABBR[t] ?? '').includes(q));
  if (team) return team;
  const cp = (p.competitions ?? []).find((c) => fold(c).includes(q));
  return cp ? comp(cp) : null;
}

/** The ranked matches for the current query, best first. */
function matches(limit = 40) {
  const q = fold(S.q);
  if (!q) return [];
  return P
    .map((p) => ({ p, s: score(p, q) }))
    .filter((x) => x.s > 0)
    .sort((a, b) =>
      b.s - a.s ||
      (b.p.lastPlayed ?? '').localeCompare(a.p.lastPlayed ?? '') ||
      b.p.runs - a.p.runs)
    .slice(0, limit)
    .map((x) => x.p);
}

/* ── deep links ──
   Every view is addressable, so a player page can be sent to someone. The hash
   is written on each render and read on load and on back/forward. */
function slugify(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

let suppressHash = false;

function writeHash() {
  if (suppressHash) return;
  const parts = [];
  if (S.view === 'player' && S.player) {
    const p = P.find((x) => x.id === S.player);
    parts.push('player', p ? `${slugify(p.name)}-${p.id.slice(0, 6)}` : S.player);
  } else {
    if (S.club) parts.push('club', slugify(S.club));
    parts.push(S.view);
  }
  if (S.fmt) parts.push(`fmt=${S.fmt}`);
  const next = '#/' + parts.join('/');
  if (location.hash !== next) history.replaceState(null, '', next);
}

function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if (!raw) return false;
  const parts = raw.split('/').filter(Boolean);

  const fmtPart = parts.find((x) => x.startsWith('fmt='));
  if (fmtPart) {
    const f = fmtPart.slice(4);
    if (['T20', 'ODI', 'Test'].includes(f)) S.fmt = f;
  }

  const i = parts.indexOf('player');
  if (i !== -1 && parts[i + 1]) {
    const tail = parts[i + 1];
    const short = tail.slice(-6);
    const hit = P.find((x) => x.id?.startsWith(short)) ??
                P.find((x) => slugify(x.name) === tail.replace(/-[0-9a-f]{6}$/, ''));
    if (hit) { S.player = hit.id; S.view = 'player'; S.club = club1(hit) || ''; return true; }
  }

  const c = parts.indexOf('club');
  if (c !== -1 && parts[c + 1]) {
    const hit = [...new Set(P.map(club1).filter(Boolean))].find((x) => slugify(x) === parts[c + 1]);
    if (hit) S.club = hit;
  }
  const view = parts.find((x) => ['today', 'form', 'all'].includes(x));
  if (view) S.view = view;
  return true;
}

function boot() {
  const d = window.__DATA__;
  P = d.players; F = d.perfs; D = d.days; M = d.meta; FX = d.fixtures ?? [];
  CAR = d.careers ?? {};
  for (const r of F) {
    if (!byP.has(r.playerId)) byP.set(r.playerId, []);
    byP.get(r.playerId).push(r);
    if (!byD.has(r.date)) byD.set(r.date, []);
    byD.get(r.date).push(r);
  }
  for (const l of byP.values()) l.sort((a, b) => b.date.localeCompare(a.date));

  readHash();
  syncControls();
  drawRail();
  draw();

  window.addEventListener('hashchange', () => {
    suppressHash = true;
    readHash();
    syncControls();
    drawRail();
    draw();
    suppressHash = false;
  });
}

/** Reflect state that lives in the hash back onto the controls. */
function syncControls() {
  document.querySelectorAll('.segs button').forEach((b) =>
    b.setAttribute('aria-pressed', String((b.dataset.f ?? '') === S.fmt)));
}

/* ── rail ──
   Franchises only. Choosing one scopes the whole app to that club: the daily
   tracker, the squad list and the format filters all narrow to its players,
   so the rail stays a short, scannable list of ten rather than 260 names. */
function drawRail() {
  const clubs = [...new Set(P.map(club1).filter(Boolean))].sort();

  $('clubs').innerHTML = `
    ${clubs.map((c) => {
      const squad = P.filter((p) => club1(p) === c);
      const on = S.club === c;
      return `<div class="club" data-team="${esc(c)}">
        <button class="club-btn" data-c="${esc(c)}" data-live="${on}" aria-current="${on}">
          <span class="crest">${ABBR[c] ?? c.slice(0, 3).toUpperCase()}</span>
          <span class="club-name">${esc(c)}</span>
          <span class="club-n">${squad.length}</span>
        </button>
      </div>`;
    }).join('')}`;
}

$('clubs').addEventListener('click', (e) => {
  const cb = e.target.closest('.club-btn');
  if (!cb) return;
  const c = cb.dataset.c ?? '';
  // Re-picking the current club clears the scope rather than doing nothing.
  S.club = S.club === c ? '' : c;
  S.player = null;
  S.day = null;
  // Stay on whichever view the reader was using; it simply re-scopes.
  if (S.view === 'player') S.view = 'today';
  drawRail(); draw(); shut();
});

/**
 * The results list, shown in place of the franchise rail while a query is live.
 *
 * It replaces the rail rather than pushing it down because both are the full height
 * of the sidebar; stacking them put the first result below the fold on a laptop.
 */
function drawHits() {
  const q = S.q.trim();
  $('seekWrap').dataset.on = String(Boolean(q));
  $('seek').setAttribute('aria-expanded', String(Boolean(q)));
  $('clubs').hidden = Boolean(q);
  $('hits').hidden = !q;
  if (!q) { $('hits').innerHTML = ''; S.cursor = -1; return; }

  const list = matches();
  const folded = fold(S.q);

  if (!list.length) {
    $('hits').innerHTML = `<div class="seek-none">
      Nothing matches <b>“${esc(q)}”</b>.<br>
      Try a surname, a franchise (“CSK”) or a competition (“Hundred”).
    </div>`;
    S.cursor = -1;
    return;
  }

  if (S.cursor >= list.length) S.cursor = list.length - 1;

  $('hits').innerHTML = `
    <div class="hits-note">${list.length} player${list.length === 1 ? '' : 's'}</div>
    ${list.map((p, n) => {
      const c = club1(p);
      const why = because(p, folded);
      const sub = [why ? `<i>${esc(why)}</i>` : null, c ? esc(c) : null]
        .filter(Boolean).join(' · ');
      return `<button class="hit" role="option" data-team="${esc(c)}" data-id="${esc(p.id)}"
          data-cursor="${n === S.cursor}" aria-selected="${n === S.cursor}">
        <span class="crest">${esc(ABBR[c] ?? (c ? c.slice(0, 3).toUpperCase() : '—'))}</span>
        <span class="hit-main">
          <b>${mark(p.name, folded)}</b>
          <span>${sub || '&nbsp;'}</span>
        </span>
      </button>`;
    }).join('')}`;

  for (const el of $('hits').querySelectorAll('[data-id]')) {
    el.onclick = () => open(el.dataset.id);
  }
}

/** Highlight the matched run inside a display name. */
function mark(name, q) {
  const i = fold(name).indexOf(q);
  if (i === -1 || !q) return esc(name);
  // The folded string and the original can differ in length (accents, hyphens), so
  // the highlight is only applied when the two line up; a wrong offset would cut a
  // name mid-character, and an unhighlighted name is a better failure than that.
  if (fold(name).length !== name.length) return esc(name);
  return `${esc(name.slice(0, i))}<mark>${esc(name.slice(i, i + q.length))}</mark>${esc(name.slice(i + q.length))}`;
}

/** Open a player's page and clear the search that led there. */
function open(id) {
  if (!id) return;
  S.player = id;
  S.view = 'player';
  S.q = '';
  S.cursor = -1;
  $('seek').value = '';
  drawHits();
  drawRail();
  draw();
  shut();
}

$('seek').addEventListener('input', (e) => {
  S.q = e.target.value;
  S.cursor = -1;
  drawHits();
});

/* Arrow keys walk the list, Enter opens, Escape clears — so the whole thing is
   usable without the mouse, and Enter on a single hit is the fast path. */
$('seek').addEventListener('keydown', (e) => {
  const list = matches();
  if (e.key === 'Escape') {
    if (!S.q) return;
    e.preventDefault();
    S.q = ''; S.cursor = -1; e.target.value = '';
    drawHits();
    return;
  }
  if (!list.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    S.cursor = (S.cursor + d + list.length + 1) % (list.length + 1) - 1;
    if (S.cursor < 0) S.cursor = d === 1 ? 0 : list.length - 1;
    drawHits();
    $('hits').querySelector('[data-cursor="true"]')?.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    // With nothing picked, Enter takes the top hit: typing a full surname and
    // pressing return should not require an arrow key first.
    open((list[S.cursor] ?? list[0]).id);
  }
});

$('seekX').onclick = () => {
  S.q = ''; S.cursor = -1;
  $('seek').value = '';
  drawHits();
  $('seek').focus();
};

/* ── router ── */
function draw() {
  refreshScope();
  $('navToday').setAttribute('aria-selected', String(S.view === 'today'));
  $('navAll').setAttribute('aria-selected', String(S.view === 'all'));
  $('navForm').setAttribute('aria-selected', String(S.view === 'form'));
  $('navAll').textContent = S.club ? 'Squad' : 'All players';

  if (S.view === 'today') drawToday();
  else if (S.view === 'player') drawPlayer();
  else if (S.view === 'form') drawForm();
  else drawAll();
  writeHash();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

const impact = (r) => (r.batting?.runs ?? 0) + (r.bowling?.wickets ?? 0) * 25;

/* ── today ── */
function drawToday() {
  const pick = pickDay;
  const days = D.filter((d) => pick(d).length);
  if (!days.length) {
    $('stage').innerHTML = `<div class="blank"><b>No play to show</b><span>${
      S.club ? `No ${esc(S.club)} player has appeared` : 'Nothing'
    }${S.fmt ? ` in ${S.fmt}` : ''}. Try another filter.</span></div>`;
    return;
  }
  // Open on the most recent day with cricket on it.
  //
  // This used to skip forward to the most recent *busy* day — eight innings across
  // all clubs, two for one club — on the reasoning that the newest date is often a
  // single stray innings and makes the landing view look empty. That is defensible
  // for the whole field and wrong for a single club: out of season a franchise has
  // one or two players turning out on any given day, so picking Kolkata skipped the
  // 30th, 27th and 24th of September for having one innings each and opened on the
  // 20th, ten days stale, while the three more recent days were real cricket.
  //
  // The newest day wins now. `trail()` already stacks the days behind it, so a quiet
  // day reads as the top of a run of form rather than as an empty page — which was
  // the real answer to the thin-landing-view problem all along.
  if (S.day === null) S.day = 0;
  const i = Math.min(S.day, days.length - 1);
  const day = days[i];
  const rows = pick(day).sort((a, b) => impact(b) - impact(a));
  const [top, ...rest] = rows;
  const tp = P.find((x) => x.id === top?.playerId);

  $('stage').innerHTML = `
    <div class="datebar">
      <button class="nav-btn" id="dPrev" ${i === 0 ? 'disabled' : ''} aria-label="Later day">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div class="datehead">
        <b>${dLong(day.date)}</b>
        <span>${rows.length} innings · ${new Set(rows.map((r) => r.playerId)).size} player${
          new Set(rows.map((r) => r.playerId)).size === 1 ? '' : 's'}${S.club ? ` · ${esc(S.club)}` : ''}</span>
      </div>
      <button class="nav-btn" id="dNext" ${i >= days.length - 1 ? 'disabled' : ''} aria-label="Earlier day">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <select id="dPick" aria-label="Jump to a date">
        ${days.map((d, n) => { const k = pick(d).length; return `<option value="${n}" ${n === i ? 'selected' : ''}>${dLong(d.date)} — ${k} innings</option>`; }).join('')}
      </select>
    </div>
    ${top ? bigRow(top, tp) : ''}
    <div class="rows stagger">${rest.map(smallRow).join('')}</div>
    ${comingUp()}
    ${trail(days, i)}`;

  $('dPrev').onclick = () => { S.day = Math.max(0, i - 1); draw(); };
  $('dNext').onclick = () => { S.day = i + 1; draw(); };
  $('dPick').onchange = (e) => { S.day = +e.target.value; draw(); };
  wire();
}

/**
 * Days behind the one on screen.
 *
 * Out of season a single club plays two or three innings a day, which leaves the
 * page mostly empty. Stacking the days behind it turns that into a readable run of
 * form instead of whitespace — and it is what a fan following one club actually
 * wants: not one date, but what their players have been doing lately.
 */
function trail(days, from) {
  const next = days.slice(from + 1, from + 6).filter((d) => pickDay(d).length);
  if (!next.length) return '';
  return `<div class="gap"></div>
    <div class="sect"><h2>Before that</h2><p>Earlier appearances${S.club ? ` by ${esc(S.club)} players` : ''}</p></div>
    ${next.map((d) => `
      <div class="dayset">
        <div class="eyebrow">${dLong(d.date)}</div>
        <div class="rows">${pickDay(d).sort((a, b) => impact(b) - impact(a)).map(smallRow).join('')}</div>
      </div>`).join('')}`;
}

/**
 * What is on next.
 *
 * The schedule lists all of world cricket, so only fixtures in competitions where
 * tracked players have been turning out are shown — otherwise this is a wall of
 * matches nobody here cares about.
 */
/** "4:30 AM" -> 270, so fixtures sort by clock rather than by first digit. */
function minutes(t) {
  const m = String(t ?? '').match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!m) return 1e9;
  const h = +m[1] % 12 + (m[3].toUpperCase() === 'PM' ? 12 : 0);
  return h * 60 + +m[2];
}

function comingUp() {
  const today = new Date().toISOString().slice(0, 10);
  // A fixture earns its place by naming a tracked player in one of the two squads,
  // which CREX publishes for the match itself. The old test — "is this a competition
  // our players turn up in" — put a wall of unrelated matches on the page.
  // Narrowed to the club in view, so picking CSK does not list a match that is on
  // only because a Mumbai player is in it.
  const next = FX.map((f) => ({ ...f, players: (f.players ?? []).filter((p) => inScope(p)) }))
    .filter((f) => f.date >= today && f.players.length)
    .sort((a, b) => a.date.localeCompare(b.date) || minutes(a.time) - minutes(b.time));
  if (!next.length) return '';

  const byDay = new Map();
  for (const f of next) {
    if (!byDay.has(f.date)) byDay.set(f.date, []);
    byDay.get(f.date).push(f);
  }

  return `<div class="gap"></div>
    <div class="sect"><h2>Coming up</h2><p>Next two days, with the tracked players named in each squad</p></div>
    <div class="fixtures">
      ${[...byDay.entries()].map(([d, list]) => `
        <div class="fx-day">
          <div class="eyebrow">${dLong(d)}</div>
          ${list.map((f) => {
            // Grouped by side, so a fixture reads as who is playing whom rather than
            // as one undifferentiated list of names.
            const who = (f.players ?? [])
              .map((x) => ({ p: P.find((y) => y.id === x.playerId), side: x.side }))
              .filter((x) => x.p);
            const sides = [f.teamA, f.teamB]
              .map((team) => ({ team, list: who.filter((x) => x.side === team) }))
              .filter((g) => g.list.length);
            return `<div class="fx">
              <span class="fx-time mono">${esc(f.time ?? '')}</span>
              <span class="fx-teams">
                <b>${esc(f.teamA)}</b> v <b>${esc(f.teamB)}</b>
                ${sides.map((g) => `<span class="fx-who">
                  <span class="fx-side">${esc(g.team)}</span>
                  ${g.list.map((x) =>
                    `<button class="fx-p" data-team="${esc(club1(x.p))}" data-id="${esc(x.p.id)}"
                      title="${esc(x.p.name)} — ${esc(x.side)}">${esc(x.p.name)}</button>`).join('')}
                </span>`).join('')}
              </span>
              <span class="fx-comp">${esc(f.competition ?? '')}${f.stage ? ` · ${esc(f.stage)}` : ''}</span>
            </div>`;
          }).join('')}
        </div>`).join('')}
    </div>`;
}

/** Innings on a day, filtered to the current club and format. */
function pickDay(d) {
  return (byD.get(d.date) ?? []).filter((r) => okFmt(r) && inScope(r));
}

/** A chart with nothing in it reads as broken; say so instead of drawing air. */
function emptyChart(msg) {
  return `<div class="spark-none">${esc(msg)}</div>`;
}

/**
 * "England v Sri Lanka", or just "Sussex" when the opponent is unknown. A domestic
 * multi-innings scorecard names only the player's own side, and printing "Sussex v —"
 * reads as a missing value rather than as something CREX does not publish.
 */
function sides(r) {
  const team = r.team || '';
  if (!r.opposition) return team || 'Match';
  return `${team} v ${r.opposition}`;
}

function figure(r) {
  const b = r.batting, w = r.bowling;
  // A Test innings that is not over: the batsman was at the crease at stumps and
  // continues the next day, so the figure is marked rather than shown as a result.
  // The match is still being played, not necessarily this innings: most of these
  // batsmen are already out, and their figure will not change. What is unsettled is
  // the match, which may yet give them another innings — so the badge names the match
  // rather than claiming the player is still at the crease.
  const live = r.provisional
    ? '<span class="live-dot" title="Test match still in progress">TEST IN PROGRESS</span>'
    : '';
  const batted = b && b.balls;
  // A spell counts as bowled if any of its numbers are present, including a wicketless
  // one. The test was `w.balls || w.wickets`, and CREX gives neither for a bowler who
  // took nothing: no ball count is scraped at all, so Manav Suthar's 0-32 in the Irani
  // Cup Test was in the data and silently absent from the page. Conceding runs is
  // bowling, and an economical wicketless spell is a performance.
  const bowled = w && (w.balls || w.wickets || w.runs != null || w.overs);

  // Whichever discipline the player actually made his mark in leads the row, at the
  // larger size, with the other beneath it. Batting used to lead unconditionally, so
  // an all-rounder's 4/28 sat in the subordinate line under a single off three balls.
  //
  // A wicket is worth twenty runs here, which is the same exchange rate `bigRow` uses
  // to pick the day's headline performance — so a row and the headline above it never
  // disagree about what a player is being shown for.
  const bowlingLeads = bowled && (!batted || (w.wickets ?? 0) * 20 > (b.runs ?? 0));

  const bat = batted
    ? `<span class="runs ${bowlingLeads ? 'sub' : ''} ${b.runs >= 50 ? 'big' : b.runs === 0 ? 'nil' : ''}">${b.runs}${b.out ? '' : '*'}<span class="balls"> (${b.balls})</span></span>`
    : '';
  const bowl = bowled
    ? `<span class="bowl ${bowlingLeads ? 'solo' : ''} ${w.wickets >= 3 ? 'haul' : ''}">${w.overs ? `${w.overs}–${w.runs}–${w.wickets}` : `${w.wickets}/${w.runs}`}</span>`
    : '';
  // An innings dated by this project rather than by CREX's start-date stamp. The
  // figure is the whole innings; the note says which day of the match it ended on,
  // and when it was built over more than one day.
  const span = r.multiDay ? spanNote(r) : '';
  // Leading figure first, so the visual order matches the sizing.
  const figs = bowlingLeads ? bowl + bat : bat + bowl;
  return (figs || '<span class="runs nil">dnb</span>') + span + live;
}

/**
 * "Day 3", or "Days 2–3" for an innings built over more than one day's play.
 *
 * Plain text, so both the row figure and the headline card can place it in their own
 * markup rather than each deciding what a span is called.
 */
function spanLabel(r) {
  const d = r.spanned ?? [];
  if (d.length > 1) return `Days ${d[0]}–${d[d.length - 1]}`;
  return r.day ? `Day ${r.day}` : '';
}

/** The same label, as the note that sits under a row's figure. */
function spanNote(r) {
  const text = spanLabel(r);
  if (!text) return '';
  const multi = (r.spanned ?? []).length > 1;
  return `<span class="carried"${
    multi ? ' title="Built over more than one day\'s play"' : ''
  }>${esc(text)}</span>`;
}

function bigRow(r, p) {
  const c = p ? club1(p) : '';
  const b = r.batting, w = r.bowling;
  const lead = b && b.balls && b.runs >= (w?.wickets ?? 0) * 20
    ? { v: `${b.runs}${b.out ? '' : '*'}`, l: `off ${b.balls} balls` }
    : w && w.wickets
      ? { v: `${w.wickets}/${w.runs}`, l: w.overs ? `in ${w.overs} overs` : 'wickets' }
      : { v: b ? `${b.runs}` : '—', l: b ? `off ${b.balls}` : 'did not bat' };

  // The day a Test innings belongs to, and whether it is still being added to.
  // `figure()` carries both for the smaller rows; this card builds its own figure
  // display and so needs them too — without which the day's leading performance was
  // the one place a live Test innings looked like a finished result.
  const day = r.multiDay ? spanLabel(r) : '';
  const live = r.provisional
    ? '<span class="live-dot" title="Test match still in progress">TEST IN PROGRESS</span>'
    : '';

  return `<button class="headline" data-team="${esc(c)}" data-id="${esc(r.playerId)}">
    <div>
      <div class="eyebrow">Performance of the day</div>
      <div class="hl-name">${esc(p?.name ?? r.name)}</div>
      <div class="hl-ctx"><b>${esc(c || '—')}</b> · ${esc(comp(r.competition))} · ${esc(sides(r))}${
        day ? ` · ${esc(day)}` : ''}</div>
      ${live ? `<div class="hl-live">${live}</div>` : ''}
    </div>
    <div class="hl-fig"><b>${lead.v}</b><span>${lead.l}</span></div>
  </button>`;
}

function smallRow(r) {
  const p = P.find((x) => x.id === r.playerId);
  const c = p ? club1(p) : '';
  return `<button class="row" data-team="${esc(c)}" data-id="${esc(r.playerId)}">
    <span class="badge">${ABBR[c] ?? '—'}</span>
    <span class="who"><b>${esc(p?.name ?? r.name)}</b><span>${esc(c || '—')}</span></span>
    <span class="where"><b>${esc(comp(r.competition))}<span class="tag">${esc(r.format)}</span></b><span>${esc(sides(r))}</span></span>
    <span class="fig">${figure(r)}</span>
  </button>`;
}

/* ── career stats ──
   Rendered from the payload build-index computed, not recomputed here: the arithmetic
   has tests, and an average worked out twice in two places is an average that will
   eventually disagree with itself.

   A missing figure prints as an em dash. Where it is missing because the scorecard
   backfill has not reached it yet, it says so on hover rather than looking like a
   number that happens to be unavailable — the distinction matters, because the figure
   will appear later without the data having changed. */
function careerBlock(playerId) {
  const career = CAR[playerId] ?? [];
  // The format filter scopes this as it scopes everything else on the page.
  const shown = S.fmt ? career.filter((f) => f.format === S.fmt) : career;
  if (!shown.length) return '';

  const num = (v, digits) =>
    v == null ? '<span class="none">—</span>' : digits == null ? String(v) : v.toFixed(digits);

  // An economy in The Hundred is runs per ball, so the unit is stated rather than
  // assumed — a 2.10 and a 6.98 in one column would otherwise look comparable.
  /* A rate drawn from a fraction of the innings is worse than no rate at all: it
     reads as the player's economy when it is one series' economy. George Linde's T20
     bowling had balls for 1 of 14 innings and showed 10.33, which is his CSA figure
     and nothing like his season. So a rate is only shown once most of the innings
     behind it have been read; until then the cell says it is waiting. */
  const PART = 0.8;
  const covered = (b) => b.innings > 0 && b.ratesFrom / b.innings >= PART;

  const partial = (b) =>
    `<span class="pend" title="Needs balls bowled, which come from the scorecard — ${b.ratesFrom} of ${b.innings} innings read so far. A rate from only some of them would read as a season figure it is not.">—</span>`;

  const econ = (b) => {
    if (b.economy == null) return '<span class="none">—</span>';
    if (!covered(b)) return partial(b);
    return b.economyUnit === 'ball'
      ? `${b.economy.toFixed(2)}<span class="none">/b</span>`
      : b.economy.toFixed(2);
  };

  const avg = (b) => {
    if (b.average != null) return b.average.toFixed(2);
    if (b.averagePending) {
      return `<span class="pend" title="Needs a scorecard read for every innings before an average can be right. Not every one of these has been read yet.">—</span>`;
    }
    // Complete, and genuinely has none: he has never been dismissed.
    return `<span class="none" title="Never dismissed in this span">—</span>`;
  };

  const bowlRate = (b, key, digits) => {
    if (b[key] != null) return covered(b) ? b[key].toFixed(digits) : partial(b);
    if (b.ratesPending && b.innings) return partial(b);
    return '<span class="none">—</span>';
  };

  const batRow = (label, b, cls) => `<tr class="${cls}">
    <td>${esc(label)}</td>
    <td>${b.innings}</td>
    <td>${b.runs}</td>
    <td>${num(b.strikeRate, 2)}</td>
    <td>${avg(b)}</td>
  </tr>`;

  const bowlRow = (label, b, cls) => `<tr class="${cls}">
    <td>${esc(label)}</td>
    <td>${b.innings}</td>
    <td>${b.wickets}</td>
    <td>${econ(b)}</td>
    <td>${bowlRate(b, 'strikeRate', 1)}</td>
  </tr>`;

  const blocks = shown.map((f) => {
    const bat = f.tournaments.filter((t) => t.batting.innings);
    const bowl = f.tournaments.filter((t) => t.bowling.innings);
    const span = (t) => `${comp(t.competition)}`;

    const batting = f.total.batting.innings ? `
      <table class="ctab">
        <thead><tr><th>Batting</th><th>Inns</th><th>Runs</th><th>SR</th><th>Avg</th></tr></thead>
        <tbody>
          ${batRow('All ' + f.format, f.total.batting, 'tot')}
          ${bat.map((t) => batRow(span(t), t.batting, '')).join('')}
        </tbody>
      </table>` : '';

    const bowling = f.total.bowling.innings ? `
      <table class="ctab" style="margin-top:${f.total.batting.innings ? '18px' : '0'}">
        <thead><tr><th>Bowling</th><th>Inns</th><th>Wkts</th><th>Econ</th><th>SR</th></tr></thead>
        <tbody>
          ${bowlRow('All ' + f.format, f.total.bowling, 'tot')}
          ${bowl.map((t) => bowlRow(span(t), t.bowling, '')).join('')}
        </tbody>
      </table>` : '';

    if (!batting && !bowling) return '';
    return `<div class="cfmt">
      <div class="chead">
        <b>${esc(f.format)}</b>
        <span>${f.tournaments.length} tournament${f.tournaments.length === 1 ? '' : 's'}</span>
      </div>
      ${batting}${bowling}
    </div>`;
  }).filter(Boolean).join('');

  if (!blocks) return '';

  // Say once, at the bottom, what a dash means — rather than footnoting every cell.
  const anyPending = shown.some(
    (f) => f.total.batting.averagePending || f.total.bowling.ratesPending
  );
  const note = anyPending
    ? `<div class="cnote">An average needs every innings read from a scorecard, and economy needs balls bowled —
       both are read separately from the player page and appear as the backfill reaches them. A dash is a figure
       withheld, never a zero.</div>`
    : '';

  return `<div class="career">
    <h3>Career by tournament</h3>
    ${blocks}${note}
  </div>`;
}

/* ── player ── */
function drawPlayer() {
  const p = P.find((x) => x.id === S.player);
  if (!p) { S.view = 'today'; draw(); return; }
  const c = club1(p);
  const all = (byP.get(p.id) ?? []).filter(okFmt);
  const last = all.slice(0, 12);

  const balls = all.reduce((n, r) => n + (r.batting?.balls ?? 0), 0);
  const runs = all.reduce((n, r) => n + (r.batting?.runs ?? 0), 0);
  const wkts = all.reduce((n, r) => n + (r.bowling?.wickets ?? 0), 0);
  const outs = all.filter((r) => r.batting?.out).length;
  const sr = balls ? ((runs / balls) * 100).toFixed(1) : '—';
  const avg = outs ? (runs / outs).toFixed(1) : runs ? '—' : '0';
  const best = all.reduce((b, r) => Math.max(b, r.batting?.runs ?? 0), 0);

  // Both disciplines, always. A bowler's page should not be a wall of empty bars,
  // and an allrounder's form is only legible when batting and bowling sit together.
  const batPeak = Math.max(10, ...last.map((r) => r.batting?.runs ?? 0));
  const bowlPeak = Math.max(2, ...last.map((r) => r.bowling?.wickets ?? 0));

  const anyBat = last.some((r) => r.batting?.balls);
  const anyBowl = last.some((r) => r.bowling?.balls || r.bowling?.wickets);

  const spark = last.slice().reverse().map((r) => {
    const batted = Boolean(r.batting?.balls);
    const v = r.batting?.runs ?? 0;
    const h = batted ? Math.max(5, Math.round((v / batPeak) * 72)) : 4;
    const cls = !batted ? 'dnb' : v === 0 ? 'nil' : v >= 50 ? 'fifty' : '';
    const tip = `${comp(r.competition)} · ${dShort(r.date)} · ${batted ? `${v}${r.batting.out ? '' : ' not out'} off ${r.batting.balls}` : 'did not bat'}`;
    return `<span class="sp ${cls}" title="${esc(tip)}"><i style="height:${h}px"></i><em>${batted ? v : '·'}</em></span>`;
  }).join('');

  const bowlSpark = last.slice().reverse().map((r) => {
    const bowled = Boolean(r.bowling?.balls || r.bowling?.wickets);
    const w = r.bowling?.wickets ?? 0;
    const h = bowled ? Math.max(5, Math.round((w / bowlPeak) * 72)) : 4;
    const cls = !bowled ? 'dnb' : w === 0 ? 'nil' : w >= 3 ? 'fifty' : '';
    const fig = r.bowling?.overs ? `${r.bowling.overs}–${r.bowling.runs}–${w}` : `${w}/${r.bowling?.runs ?? 0}`;
    const tip = `${comp(r.competition)} · ${dShort(r.date)} · ${bowled ? fig : 'did not bowl'}`;
    return `<span class="sp ${cls}" title="${esc(tip)}"><i style="height:${h}px"></i><em>${bowled ? w : '·'}</em></span>`;
  }).join('');

  $('stage').innerHTML = `
    <div data-team="${esc(c)}">
      <div class="phero">
        <div class="eyebrow">${esc(c || 'No franchise')}</div>
        <h2>${esc(p.name)}</h2>
        <div class="pmeta">
          ${(p.formats ?? []).map((f) => `<span class="pill">${esc(f)}</span>`).join('')}
          <span class="pill ghost">${(p.competitions ?? []).length} competitions</span>
        </div>
      </div>
      <div class="pstats">
        <div><b>${runs}</b><span class="eyebrow">Runs</span></div>
        <div><b>${wkts}</b><span class="eyebrow">Wickets</span></div>
        <div><b>${all.length}</b><span class="eyebrow">Innings</span></div>
        <div><b>${avg}</b><span class="eyebrow">Average</span></div>
        <div><b>${sr}</b><span class="eyebrow">Strike rate</span></div>
        <div><b>${best}</b><span class="eyebrow">Best</span></div>
      </div>
      ${last.length ? `<div class="formbox">
        <div class="eyebrow">Recent form — last ${last.length} matches, oldest first</div>
        <div class="twin">
          <div>
            <div class="mini">Runs scored</div>
            ${anyBat ? `<div class="spark">${spark}</div>` : emptyChart('Has not batted in this run')}
          </div>
          <div>
            <div class="mini">Wickets taken</div>
            ${anyBowl ? `<div class="spark">${bowlSpark}</div>` : emptyChart('Has not bowled in this run')}
          </div>
        </div>
      </div>` : ''}
      ${careerBlock(p.id)}
      <div class="ledger">
        ${all.length ? `<div class="scroller"><table>
          <thead><tr><th>Date</th><th>Match</th><th style="text-align:right">Figures</th></tr></thead>
          <tbody>${all.map((r) => `<tr>
            <td class="dt">${dShort(r.date)}</td>
            <td class="mt"><b>${esc(comp(r.competition))}<span class="tag">${esc(r.format)}</span></b><span>${esc(sides(r))}</span></td>
            <td class="rt">${figure(r)}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : `<div class="blank"><b>No matches yet</b><span>In the squad, but has not appeared${S.fmt ? ` in ${S.fmt}` : ''} this season.</span></div>`}
      </div>
    </div>`;
}

/* ── club ── */
function drawClub() {
  const c = S.club;
  if (!c) { S.view = 'today'; draw(); return; }
  const squad = squadInScope().filter((p) => club1(p) === c);
  const ids = new Set(squad.map((p) => p.id));
  const rows = F.filter((r) => ids.has(r.playerId) && okFmt(r));

  const dm = new Map();
  for (const r of rows) { if (!dm.has(r.date)) dm.set(r.date, []); dm.get(r.date).push(r); }
  const days = [...dm.entries()].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 5);

  const runs = rows.reduce((n, r) => n + (r.batting?.runs ?? 0), 0);
  const wkts = rows.reduce((n, r) => n + (r.bowling?.wickets ?? 0), 0);
  const away = squad.filter((p) => (p.competitions ?? []).some((x) => x !== IPL)).length;

  $('stage').innerHTML = `
    <div data-team="${esc(c)}">
      <div class="chero">
        <div>
          <div class="eyebrow">Franchise</div>
          <h2>${esc(c)}</h2>
          <div class="sub">${squad.length} players tracked · ${away} of them playing outside the IPL</div>
        </div>
        <div class="cfigs">
          <div><b>${runs}</b><span class="eyebrow">Runs</span></div>
          <div><b>${wkts}</b><span class="eyebrow">Wickets</span></div>
          <div><b>${rows.length}</b><span class="eyebrow">Innings</span></div>
        </div>
      </div>

      <div class="sect"><h2>Latest form</h2><p>Where these players have been turning out</p></div>
      ${days.length ? days.map(([d, rs]) => `
        <div class="dayset">
          <div class="eyebrow">${dLong(d)}</div>
          <div class="rows">${rs.sort((a, b) => impact(b) - impact(a)).map(smallRow).join('')}</div>
        </div>`).join('') : `<div class="blank"><b>Quiet spell</b><span>No ${esc(c)} player has appeared${S.fmt ? ` in ${S.fmt}` : ''} recently.</span></div>`}

      <div class="gap"></div>
      <div class="sect"><h2>Squad</h2><p>${squad.length} players</p></div>
      <div class="cards stagger">
        ${squad.slice().sort((a, b) => b.runs - a.runs).map(card).join('')}
      </div>
    </div>`;
  wire();
}

/**
 * A squad card reports the player's most recent assignment, not his season total.
 * "392 runs in CPL 2026" says where a player actually is and how he is going;
 * a season aggregate across six competitions says much less.
 */
function lastSeries(p) {
  const rows = (byP.get(p.id) ?? []).filter(okFmt);
  if (!rows.length) return null;
  const name = rows[0].competition;
  const inIt = rows.filter((r) => r.competition === name);
  return {
    name,
    when: rows[0].date,
    innings: inIt.length,
    runs: inIt.reduce((n, r) => n + (r.batting?.runs ?? 0), 0),
    wickets: inIt.reduce((n, r) => n + (r.bowling?.wickets ?? 0), 0),
    balls: inIt.reduce((n, r) => n + (r.batting?.balls ?? 0), 0),
  };
}

function card(p) {
  const c = club1(p);
  const s = lastSeries(p);
  // A player with no canonical id has no match history to open, so the card is
  // inert rather than a button that looks clickable and does nothing.
  const dead = !p.id;

  return `<button class="card${dead ? ' inert' : ''}" data-team="${esc(c)}"${
    dead ? ' disabled aria-disabled="true"' : ` data-id="${esc(p.id)}"`}>
    <h3>${esc(p.name)}</h3>
    ${s
      ? `<div class="cm"><b>${esc(comp(s.name))}</b> · ${dShort(s.when)}</div>
         <div class="cfg">
           <div class="${s.runs ? '' : 'zero'}"><b>${s.runs}</b><span class="eyebrow">Runs</span></div>
           <div class="${s.wickets ? '' : 'zero'}"><b>${s.wickets}</b><span class="eyebrow">Wkts</span></div>
           <div><b>${s.innings}</b><span class="eyebrow">${s.innings === 1 ? 'Inns' : 'Inns'}</span></div>
         </div>`
      : `<div class="cm dim">Yet to play this season</div>
         <div class="cfg">
           <div class="zero"><b>—</b><span class="eyebrow">Runs</span></div>
           <div class="zero"><b>—</b><span class="eyebrow">Wkts</span></div>
           <div class="zero"><b>—</b><span class="eyebrow">Inns</span></div>
         </div>`}
  </button>`;
}

/* ── form: who is actually scoring right now ──
   A season table flattens a player who made 400 runs in April and none since
   against one who is scoring this week. This window answers the question a fan
   actually asks — who is in form — so it is dated, not cumulative. */
const WINDOWS = [
  { days: 14, label: 'Last 14 days' },
  { days: 30, label: 'Last 30 days' },
  { days: 90, label: 'Last 3 months' },
];

function drawForm() {
  const win = WINDOWS.find((w) => w.days === S.win) ?? WINDOWS[1];
  const latest = D[0]?.date ?? new Date().toISOString().slice(0, 10);
  const cut = new Date(new Date(latest + 'T00:00:00').getTime() - win.days * 864e5)
    .toISOString().slice(0, 10);

  const rows = F.filter((r) => r.date >= cut && okFmt(r) && inScope(r));
  const agg = new Map();
  for (const r of rows) {
    if (!agg.has(r.playerId)) {
      agg.set(r.playerId, { runs: 0, wkts: 0, inns: 0, balls: 0, outs: 0, best: 0, bestBowl: 0 });
    }
    const a = agg.get(r.playerId);
    a.runs += r.batting?.runs ?? 0;
    a.balls += r.batting?.balls ?? 0;
    a.wkts += r.bowling?.wickets ?? 0;
    a.inns += 1;
    if (r.batting?.out) a.outs += 1;
    a.best = Math.max(a.best, r.batting?.runs ?? 0);
    a.bestBowl = Math.max(a.bestBowl, r.bowling?.wickets ?? 0);
  }

  const list = [...agg.entries()]
    .map(([id, a]) => ({ p: P.find((x) => x.id === id), ...a }))
    .filter((x) => x.p);

  const bat = list.filter((x) => x.runs > 0).sort((a, b) => b.runs - a.runs).slice(0, 10);
  const bowl = list.filter((x) => x.wkts > 0).sort((a, b) => b.wkts - a.wkts).slice(0, 10);

  $('stage').innerHTML = `
    <div class="sect">
      <h2>In form</h2>
      <p>${rows.length} innings${S.club ? ` by ${esc(S.club)} players` : ''} · ${win.label.toLowerCase()}</p>
      <div class="winpick" role="group" aria-label="Time window">
        ${WINDOWS.map((w) => `<button data-w="${w.days}" aria-pressed="${w.days === win.days}">${w.label}</button>`).join('')}
      </div>
    </div>

    ${!list.length ? `<div class="blank"><b>No play in this window</b><span>Try a longer window or another format.</span></div>` : `
    <div class="boards">
      ${board('Runs', bat, (x) => x.runs, (x) =>
        `${x.inns} ${x.inns === 1 ? 'match' : 'matches'} · best ${x.best}${
          x.balls ? ` · SR ${((x.runs / x.balls) * 100).toFixed(0)}` : ''}`)}
      ${board('Wickets', bowl, (x) => x.wkts, (x) =>
        `${x.inns} ${x.inns === 1 ? 'match' : 'matches'} · best ${x.bestBowl} in a match`)}
    </div>`}`;

  $('stage').querySelectorAll('.winpick button').forEach((b) => {
    b.onclick = () => { S.win = +b.dataset.w; draw(); };
  });
  wire();
}

function board(title, rows, value, sub) {
  if (!rows.length) {
    return `<div class="board"><div class="board-head">${title}</div>
      <div class="blank" style="padding:40px 20px"><span>Nobody yet in this window.</span></div></div>`;
  }
  const top = value(rows[0]) || 1;
  return `<div class="board">
    <div class="board-head">${title}</div>
    <ol class="ranks stagger">
      ${rows.map((x, i) => {
        const c = club1(x.p);
        const v = value(x);
        return `<li>
          <button class="rank" data-team="${esc(c)}" data-id="${esc(x.p.id ?? '')}">
            <span class="rk">${i + 1}</span>
            <span class="rn">
              <b>${esc(x.p.name)}</b>
              <span>${esc(c || '—')} · ${sub(x)}</span>
            </span>
            <span class="rv">${v}</span>
            <span class="rbar" style="width:${Math.round((v / top) * 100)}%"></span>
          </button>
        </li>`;
      }).join('')}
    </ol>
  </div>`;
}

/* ── all players ── */
function drawAll() {
  let list = squadInScope().slice();
  if (S.fmt) list = list.filter((p) => (p.formats ?? []).includes(S.fmt));
  // Cards report the latest assignment, so the most recently active player leads.
  list.sort((a, b) => (b.lastPlayed ?? '').localeCompare(a.lastPlayed ?? '') || b.runs - a.runs);

  $('stage').innerHTML = `
    <div class="sect"><h2>${S.club ? esc(S.club) : 'All players'}</h2><p>${list.length} player${list.length === 1 ? '' : 's'}${S.club ? '' : ' across ten franchises'}${S.fmt ? ` · ${S.fmt}` : ''}</p></div>
    <div class="cards stagger">${list.map(card).join('')}</div>`;
  wire();
}

/* ── shared ── */
function wire() {
  $('stage').querySelectorAll('[data-id]').forEach((el) => {
    el.onclick = () => {
      if (!el.dataset.id) return;
      S.player = el.dataset.id; S.view = 'player';
      drawRail(); draw();
    };
  });
}

function shut() {
  $('rail').classList.remove('open');
  document.querySelector('.veil')?.remove();
}

$('navToday').onclick = () => { S.view = 'today'; draw(); };
$('navAll').onclick = () => { S.view = 'all'; draw(); };
$('navForm').onclick = () => { S.view = 'form'; draw(); };

document.querySelectorAll('.segs button').forEach((b) => {
  b.onclick = () => {
    S.fmt = b.dataset.f;
    document.querySelectorAll('.segs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    S.day = null;
    draw();
  };
});

$('burger').onclick = () => {
  $('rail').classList.add('open');
  const v = document.createElement('div');
  v.className = 'veil';
  v.onclick = shut;
  document.body.appendChild(v);
};

boot();
</script>
