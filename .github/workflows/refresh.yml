# Daily refresh: scrape CREX, rebuild the index, publish the page.
#
# Runs on GitHub's free tier. Public repositories get unlimited Actions minutes, so
# the only real limits are the 6-hour job cap (a full scrape takes about 90 minutes)
# and the 10 GB cache allowance, which the CREX cache sits well inside.
#
# The scrape is incremental. `data/cache/crex` is restored before the run and saved
# after it, so a player whose page was read within `CACHE_HOURS` is not fetched again
# and a daily run only picks up what has changed. The cache key carries the run id so
# each day writes a new entry, and `restore-keys` falls back to the most recent one.

name: refresh

on:
  schedule:
    # 18:30 UTC = 00:00 IST the following day, since IST is UTC+5:30. India does not
    # observe DST, so this stays midnight year-round rather than drifting twice a year.
    - cron: '30 18 * * *'
  # So a refresh can be triggered by hand without waiting for the schedule.
  workflow_dispatch:
    inputs:
      full_rescrape:
        description: 'Ignore the page cache and re-read every player (~90 min)'
        type: boolean
        default: false
      backfill:
        description: 'Date Test innings already scraped, from the commentary feed'
        type: boolean
        default: false

# One refresh at a time: two runs would race on the same commit.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chromium
        # Only the one browser, with the system libraries Playwright needs.
        run: npx playwright install --with-deps chromium

      - name: Restore CREX cache
        uses: actions/cache@v4
        with:
          path: data/cache/crex
          key: crex-cache-${{ github.run_id }}
          restore-keys: |
            crex-cache-

      - name: Scrape players
        env:
          SEASON_START: ${{ vars.SEASON_START || '2026-06-01' }}
          # A page read within this window is taken from cache, so the daily run
          # refetches only what has gone stale.
          #
          # `full_rescrape` sets it to 0, which disables the cache entirely. That is
          # needed after the scraper starts reading a new field off the page: the
          # cached copy predates it, and a cache hit would keep serving rows without
          # it indefinitely. Capturing each row's match id was such a change.
          CACHE_HOURS: ${{ inputs.full_rescrape && '0' || '20' }}
        run: npm run scrape

      - name: Scrape fixtures
        # Fixtures are always refetched: the whole point is what is on today.
        run: npm run fixtures

      - name: Backfill Test innings dates
        # One-time, and only when asked. Walks the commentary feed for every Test
        # already scraped and records which day each innings ended on — the daily
        # scrape can only date matches it watched being played.
        #
        # Needs the match ids the scrape records, so it runs after it. Soft by
        # design: a match with no feed is skipped, and `|| true` keeps a refresh
        # from failing over a one-off migration step.
        if: ${{ inputs.backfill }}
        run: npm run backfill || true

      - name: Build the site
        env:
          SEASON_START: ${{ vars.SEASON_START || '2026-06-01' }}
        run: npm run build

      - name: Commit the refreshed data
        # The push is retried onto whatever main has become, because a refresh takes
        # up to two hours and anything pushed during it makes this a non-fast-forward.
        # A full scrape plus the commentary backfill was lost that way: the data was
        # scraped, dated and committed locally, then the push was rejected and the run
        # failed with the work still on the runner.
        #
        # A rebase is the right integration here rather than a merge: this commit only
        # ever touches generated files under data/ and site/, so replaying it on top of
        # newer source commits is exactly what is wanted. `-X theirs` resolves in favour
        # of the refreshed copy, which is the newer scrape of the same artefacts.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          git commit -m "Refresh: $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort || true
              echo "rebase failed; leaving main alone"
              exit 1
            }
          done
          echo "could not push after 3 attempts"
          exit 1

      - name: Prepare the page
        # Pages serves a directory, so the built file becomes its index.
        run: |
          mkdir -p _site
          cp site/offseason-live.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
